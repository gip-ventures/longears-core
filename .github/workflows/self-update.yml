name: Longears Self-Update (Dogfood)

on:
  schedule:
    # Run every hour; the action itself checks per-ecosystem schedules
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run all ecosystems regardless of their configured schedule
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      # npm
      - "package.json"
      # pip
      - "requirements.txt"
      - "requirements/**/*.txt"
      - "requirements-*.txt"
      - "Pipfile"
      - "pyproject.toml"
      # bundler
      - "Gemfile"
      - "Gemfile.lock"
      # maven
      - "pom.xml"
      - "**/pom.xml"
      # gomod
      - "go.mod"
      # composer
      - "composer.json"
      # nuget
      - "**/*.csproj"
      - "**/*.fsproj"
      - "**/*.vbproj"
      - "**/packages.config"
      - "**/Directory.Packages.props"
      # dotnet-sdk
      - "global.json"
      # docker
      - "Dockerfile"
      - "Dockerfile.*"
      - "*.dockerfile"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      # mix
      - "mix.exs"
      # github-actions: .github/workflows/*.yml deliberately omitted — would
      # cause self-update.yml to retrigger itself; hourly cron covers this ecosystem
      # pub
      - "pubspec.yaml"
      - "pubspec.yml"
      # devcontainers
      - ".devcontainer/devcontainer.json"
      - ".devcontainer.json"
      - ".devcontainer/**/devcontainer.json"
      # gitsubmodule
      - ".gitmodules"

jobs:
  scan:
    name: Dependency Metadata Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Longears
        uses: ./
        id: longears
        with:
          config-path: .github/longears.yml
          # On push: bypass schedule gate so the scan actually runs.
          # On workflow_dispatch: respect the force checkbox.
          # On schedule: default to false.
          force: ${{ github.event_name == 'push' && 'true' || inputs.force || 'false' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: longears-results.json

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: longears-results
          path: longears-results.json
          retention-days: 7
