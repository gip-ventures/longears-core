name: Longears Report Sender
description: POSTs a Longears scan report JSON to the Longears Cloud Run API
author: gip-ventures

inputs:
  report-file:
    description: Path to the JSON report produced by the scanner action
    default: longears-results.json
  api-key:
    description: API key sent as the Authorization Bearer token
    required: true

outputs:
  status-code:
    description: HTTP status code returned by the API endpoint
  response-body:
    description: Raw response body returned by the API endpoint

runs:
  using: node24
  main: dist/index.js
